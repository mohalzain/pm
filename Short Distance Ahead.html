<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Distance Ahead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE  hushed occasion: one sentence at night, lots of air
   IDEA   standing at the edge of a field of points that fades into fog: you see a little way, and the rest is still to be worked out
   PICTURE full-screen canvas of a gently rolling point surface (a loss landscape) drifting toward you, lit near, lost far
   COLOUR blue-black ground, pale moonlit ink, one cold horizon glow; fixed palette in both themes
   TYPE   Newsreader 300 very large for the quote + Inter for the attribution
   LAYOUT quote in the sky's upper left, field filling the lower half; on a phone the quote sits higher and smaller, field below */
:root{color-scheme:dark;--bg:#070a0f;--ink:#eef2f7;--dim:#8a97a8;--glow:#6fa8ff}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#field{position:fixed;inset:0;width:100%;height:100%;display:block}
.sky{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% 62%,rgba(111,168,255,.16),transparent 60%),linear-gradient(to bottom,#05070b 0%,transparent 45%)}
main{position:relative;z-index:1;height:100%;display:grid;align-content:start;padding:clamp(56px,13vh,150px) max(7vw,20px) 0}
blockquote{margin:0;max-width:15.5em;font-family:Newsreader,Georgia,serif;font-weight:300;font-size:clamp(34px,5.6vw,80px);line-height:1.06;letter-spacing:-.022em;text-wrap:balance;text-shadow:0 2px 30px rgba(7,10,15,.9)}
blockquote p{margin:0}
blockquote em{font-style:italic;color:#fff}
.mark{display:block;font-size:.9em;line-height:.5;height:.32em;color:var(--glow);opacity:.75}
figcaption{margin-top:clamp(22px,3.4vh,40px);display:flex;align-items:center;gap:14px;color:var(--dim);font-size:15px}
figcaption::before{content:"";width:40px;height:1px;background:currentColor;opacity:.6}
figcaption b{font-weight:500;color:var(--ink)}
figure{margin:0}
@media(max-width:600px){main{padding-top:clamp(40px,9vh,80px)}blockquote{font-size:clamp(30px,8.6vw,44px)}figcaption{font-size:14px}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="sky"></div>
<main>
  <figure>
    <blockquote>
      <span class="mark">“</span>
      <p>We can only see a short distance ahead, but we can see <em>plenty there</em> that needs to be done.</p>
    </blockquote>
    <figcaption><span><b>Alan Turing</b>, 1950</span></figcaption>
  </figure>
</main>
<script>
{
  const c = document.getElementById('field');
  const g = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let W = 0, H = 0, dpr = 1, t = 0, last = 0;
  let mx = 0, tmx = 0;

  const COLS = 150, ROWS = 100, GAP = 0.42, ZMAX = ROWS * GAP, CAM = 1.25;
  const SPEED = 0.55;
  let offset = 0;

  const height = (x, z) =>
    0.45 * Math.sin(x * 0.23 + z * 0.11 + t * 0.35) +
    0.3 * Math.sin(x * 0.07 - z * 0.19 + t * 0.2) +
    0.18 * Math.cos((x + z) * 0.41 - t * 0.5);

  const size = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  };

  const draw = () => {
    g.clearRect(0, 0, W, H);
    const narrow = W < 600;
    const horizon = H * (narrow ? 0.5 : 0.56);
    const f = Math.max(W, H) * 0.62;
    const camX = mx * 3;
    const frac = offset % GAP;
    for (let r = ROWS; r >= 1; r--) {
      const z = r * GAP - frac;
      if (z < 0.35) continue;
      const fade = 1 - z / ZMAX;
      if (fade <= 0) continue;
      const fog = fade * fade * (3 - 2 * fade);
      const wz = z + offset;
      for (let i = 0; i < COLS; i++) {
        const x = (i - COLS / 2) * GAP;
        const y = height(x, wz);
        const sx = W / 2 + (x - camX) * f / z;
        if (sx < -10 || sx > W + 10) continue;
        const sy = horizon + (CAM - y) * f / z;
        if (sy > H + 10) continue;
        const rad = Math.min(3.2, Math.max(0.45, 1.5 / z * (narrow ? 0.9 : 1.2)));
        const lift = Math.min(1, Math.max(0, (y + 0.6) / 1.4));
        const a = fog * (0.3 + 0.7 * lift) * Math.min(1, z * 1.4);
        g.fillStyle = `rgba(${200 + 40 * lift | 0},${215 + 30 * lift | 0},255,${a.toFixed(3)})`;
        if (rad < 1.1) { g.fillRect(sx - rad, sy - rad, rad * 2, rad * 2); }
        else { g.beginPath(); g.arc(sx, sy, rad, 0, 6.283); g.fill(); }
      }
    }
  };

  const frame = now => {
    const dt = Math.min(0.05, (now - (last || now)) / 1000);
    last = now;
    if (!still.matches) {
      t += dt;
      offset += SPEED * dt;
      mx += (tmx - mx) * Math.min(1, dt * 2);
    }
    draw();
    requestAnimationFrame(frame);
  };

  addEventListener('pointermove', e => { tmx = (e.clientX / innerWidth - 0.5); });
  addEventListener('pointerleave', () => { tmx = 0; });

  const ro = new ResizeObserver(size);
  ro.observe(c);
  size();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
